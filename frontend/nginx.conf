server {
    listen 80;
    root /usr/share/nginx/html;

    # API (including SSE streams) goes to the backend container. Buffering off
    # so server-sent events reach the browser as they are produced; the long
    # read timeout covers slow LLM calls between events.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        client_max_body_size 20m;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
