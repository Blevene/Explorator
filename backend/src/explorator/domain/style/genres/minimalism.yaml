genre: minimalism
display_name: Minimalism
version: 2
harmonic_vocabulary:
- maj
- min
- sus2
- sus4
- add9
- m7
- maj7
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: low
  borrowed_chord_tolerance: low
  cadence_closure_preference: low
voicing_tendencies:
  spacing: low
  register_bias: mid_high
  extension_density: low_medium
  top_voice_continuity_importance: high
bass_tendencies:
  root_emphasis: high
  pedal_tone_tolerance: high
  rhythmic_activity: high
groove_tendencies:
  comp_density: busy
  articulation_style: motoric_pulse
  syncopation_level: moderate
melodic_tendencies:
  motion_preference: stepwise
  range_placement: overlapping
  density: active
  phrase_length: 2
  strong_beat_preference: chord_tones
  rest_between_phrases: false
common_devices:
- motoric arpeggiation
- phase shifting
- additive rhythm
- chromatic mediant oscillation
- diatonic static pulsing
- modular cellular repetition
experimentation_envelope:
  harmonic_deviation_tolerance: 0.15
  voicing_deviation_tolerance: 0.1
  groove_deviation_tolerance: 0.05
voicing_preferences:
  default_voicing_type: closed
  default_register: mid_high
  default_density: medium
  default_voice_count: 3
  favor_extensions: false
  top_voice_continuity: high
  variant_voicing_types:
  - closed
  - cluster
bass_preferences:
  default_bass_mode: pedal
  default_register: low
  rhythmic_density: active
  variant_bass_modes:
  - pedal
  - supportive
