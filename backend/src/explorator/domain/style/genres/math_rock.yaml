genre: math_rock
display_name: Math Rock
version: 1
harmonic_vocabulary:
- maj7
- maj9
- add9
- sus2
- m11
- maj7#11
- m7
- add4
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: low
  borrowed_chord_tolerance: medium
  cadence_closure_preference: low
voicing_tendencies:
  spacing: high
  register_bias: mid_high
  extension_density: high
  top_voice_continuity_importance: high
bass_tendencies:
  root_emphasis: low_medium
  pedal_tone_tolerance: medium_high
  rhythmic_activity: high
groove_tendencies:
  comp_density: high
  articulation_style: articulate_floating
  syncopation_level: high
melodic_tendencies:
  motion_preference: mixed
  range_placement: overlapping
  density: active
  phrase_length: high
  strong_beat_preference: extensions
  rest_between_phrases: false
common_devices:
- tapped extended arpeggios
- open-string pedal drones
- odd-meter rhythmic ostinatos
- diatonic parallel planning
- abrupt ensemble stops
experimentation_envelope:
  harmonic_deviation_tolerance: 0.4
  voicing_deviation_tolerance: 0.9
  groove_deviation_tolerance: 1.0
voicing_preferences:
  default_voicing_type: open
  default_register: mid_high
  default_density: active
  default_voice_count: 5
  favor_extensions: true
  top_voice_continuity: high
  variant_voicing_types:
  - open
  - drop2
bass_preferences:
  default_bass_mode: syncopated
  default_register: low
  rhythmic_density: high
  variant_bass_modes:
  - syncopated
  - supportive
