genre: dubstep
display_name: Dubstep
version: 1
harmonic_vocabulary:
- m
- m7
- m9
- m11
- sus2
- sus4
- maj7
- maj9
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: low_medium
  borrowed_chord_tolerance: high
  cadence_closure_preference: low
voicing_tendencies:
  spacing: high
  register_bias: mid_high
  extension_density: medium
  top_voice_continuity_importance: low
bass_tendencies:
  root_emphasis: high
  pedal_tone_tolerance: high
  rhythmic_activity: high
groove_tendencies:
  comp_density: low
  articulation_style: swung_halftime
  syncopation_level: high
melodic_tendencies:
  motion_preference: stepwise
  range_placement: above_voicing
  density: sparse
  phrase_length: high
  strong_beat_preference: roots
  rest_between_phrases: high
common_devices:
- sub-bass pedal points
- parallel chord planing
- micro-shifted vocal chops
- dub delay and reverb
- phrygian bass motifs
experimentation_envelope:
  harmonic_deviation_tolerance: 0.8
  voicing_deviation_tolerance: 0.7
  groove_deviation_tolerance: 0.2
voicing_preferences:
  default_voicing_type: open
  default_register: mid_high
  default_density: sparse
  default_voice_count: 3
  favor_extensions: true
  top_voice_continuity: low
  variant_voicing_types:
  - open
  - drop2
bass_preferences:
  default_bass_mode: syncopated
  default_register: low
  rhythmic_density: active
  variant_bass_modes:
  - syncopated
  - pedal
