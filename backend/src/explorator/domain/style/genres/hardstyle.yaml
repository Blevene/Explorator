genre: hardstyle
display_name: Hardstyle
version: 1
harmonic_vocabulary:
- min
- maj
- sus2
- sus4
- '5'
harmonic_tendencies:
  functional_strength: medium
  chromaticism_level: low
  borrowed_chord_tolerance: low
  cadence_closure_preference: high
voicing_tendencies:
  spacing: closed
  register_bias: mid_high
  extension_density: low
  top_voice_continuity_importance: high
bass_tendencies:
  root_emphasis: high
  pedal_tone_tolerance: high
  rhythmic_activity: high
groove_tendencies:
  comp_density: moderate
  articulation_style: driving_straight
  syncopation_level: moderate
melodic_tendencies:
  motion_preference: mixed
  range_placement: above_voicing
  density: active
  phrase_length: 8
  strong_beat_preference: chord_tones
  rest_between_phrases: true
common_devices:
- pitched kick bass
- supersaw chord stacks
- gallop rhythm
- epic aeolian loops
- syncopated reverse bass
experimentation_envelope:
  harmonic_deviation_tolerance: 0.1
  voicing_deviation_tolerance: 0.2
  groove_deviation_tolerance: 0.0
voicing_preferences:
  default_voicing_type: closed
  default_register: mid_high
  default_density: medium
  default_voice_count: 5
  favor_extensions: false
  top_voice_continuity: high
  variant_voicing_types:
  - closed
bass_preferences:
  default_bass_mode: supportive
  default_register: low
  rhythmic_density: active
  variant_bass_modes:
  - supportive
  - pedal
  - syncopated
