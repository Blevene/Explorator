genre: lo_fi_hip_hop
display_name: Lo-Fi Hip Hop
version: 1
harmonic_vocabulary:
- maj7
- m7
- m9
- m11
- maj9
- 7sus4
- sus2
- '13'
- 7b9
- m7b5
- maj13
- m13
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: medium_high
  borrowed_chord_tolerance: high
  cadence_closure_preference: low
voicing_tendencies:
  spacing: mixed
  register_bias: mid
  extension_density: high
  top_voice_continuity_importance: high
bass_tendencies:
  root_emphasis: medium
  pedal_tone_tolerance: high
  rhythmic_activity: low
groove_tendencies:
  comp_density: moderate
  articulation_style: lazy_swing
  syncopation_level: heavy
melodic_tendencies:
  motion_preference: mixed
  range_placement: overlapping
  density: sparse
  phrase_length: 4
  strong_beat_preference: extensions
  rest_between_phrases: true
common_devices:
- unquantized dilla feel
- parallel chord planing
- low-pass filtering
- pitch warble
- unresolved extensions
- sub-bass pedal points
experimentation_envelope:
  harmonic_deviation_tolerance: 0.7
  voicing_deviation_tolerance: 0.8
  groove_deviation_tolerance: 0.9
voicing_preferences:
  default_voicing_type: drop2
  default_register: mid
  default_density: dense
  default_voice_count: 5
  favor_extensions: true
  top_voice_continuity: high
  variant_voicing_types:
  - closed
  - drop2
bass_preferences:
  default_bass_mode: syncopated
  default_register: low
  rhythmic_density: sparse
  variant_bass_modes:
  - supportive
  - syncopated
  - pedal
