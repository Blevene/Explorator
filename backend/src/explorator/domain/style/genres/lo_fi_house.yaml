genre: lo_fi_house
display_name: Lo-Fi House
version: 1
harmonic_vocabulary:
- m7
- maj7
- m9
- m11
- sus4
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: medium_high
  borrowed_chord_tolerance: high
  cadence_closure_preference: low
voicing_tendencies:
