genre: shoegaze
display_name: Shoegaze
version: 1
harmonic_vocabulary:
- maj7
- sus2
- sus4
- add9
- m7
- biii
- bvi
- bvii
harmonic_tendencies:
  functional_strength: low
  chromaticism_level: medium
  borrowed_chord_tolerance: high
  cadence_closure_preference: low
voicing_tendencies:
  spacing: open
  register_bias: mid_high
  extension_density: high
  top_voice_continuity_importance: high
bass_tendencies:
  root_emphasis: high
  pedal_tone_tolerance: high
  rhythmic_activity: high
groove_tendencies:
  comp_density: busy
  articulation_style: driving_wash
  syncopation_level: light
melodic_tendencies:
  motion_preference: stepwise
  range_placement: overlapping
  density: sparse
  phrase_length: 8
  strong_beat_preference: extensions
  rest_between_phrases: true
common_devices:
- open-string drones
- glide guitar pitch-bending
- parallel chord planing
- reverse reverb smearing
- buried glossolalia vocals
- motorik rhythm section
experimentation_envelope:
  harmonic_deviation_tolerance: 0.7
  voicing_deviation_tolerance: 0.8
  groove_deviation_tolerance: 0.3
voicing_preferences:
  default_voicing_type: open
  default_register: mid_high
  default_density: high
  default_voice_count: 6
  favor_extensions: true
  top_voice_continuity: high
  variant_voicing_types:
  - open
  - drop2
bass_preferences:
  default_bass_mode: supportive
  default_register: low
  rhythmic_density: high
  variant_bass_modes:
  - supportive
  - pedal
