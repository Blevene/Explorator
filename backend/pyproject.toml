[project]
name = "explorator"
version = "0.1.0"
description = "Genre-aware musical exploration engine"
license = "MIT"
authors = [{ name = "Lightforge Ventures" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "neo4j>=6.2.0",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.3",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "music21>=9.1.0",
    "pretty-midi>=0.2.10",
    "sse-starlette>=2.0.0",
    "openai>=3.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.10",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explorator"]

# Only resolve releases at least 3 days old (supply-chain cooldown). Set here,
# not in a user-level uv.toml, so every machine and CI resolve the same lock.
[tool.uv]
exclude-newer = "3 days"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use PascalCase names for local mock classes,
# UPPER_CASE constants inside fixtures, and post-mock-setup imports
# that have to land below other module-level code.
"tests/**/*.py" = ["N806", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# music21 publishes no type stubs. We import it as untyped — call sites in
# our code that use music21 may need per-call `# type: ignore[no-untyped-call]`.
[[tool.mypy.overrides]]
module = ["music21.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external services (Neo4j, Gemini API)",
]
