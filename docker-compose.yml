services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/explorator_dev
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
    # Probe the HTTP listener (up alongside Bolt, as in CI): `neo4j status`
    # reports running before the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # Isolated Neo4j for the pytest suite. conftest fixtures wipe the DB
  # after every test (MATCH (n) DETACH DELETE n), so this must not share
  # state with the dev container. Data lives in tmpfs — ephemeral across
  # restarts, which is correct for a disposable test DB and faster than a
  # disk-backed volume.
  neo4j-test:
    image: neo4j:5-community
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/explorator_test
      NEO4J_PLUGINS: '[]'
    tmpfs:
      - /data
    # Probe the HTTP listener (up alongside Bolt, as in CI): `neo4j status`
    # reports running before the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  neo4j_data:
