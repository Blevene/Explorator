services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/explorator_dev
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
    # Probe the HTTP listener (up alongside Bolt, as in CI): `neo4j status`
    # reports running before the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # Isolated Neo4j for the pytest suite. conftest fixtures wipe the DB
  # after every test (MATCH (n) DETACH DELETE n), so this must not share
  # state with the dev container. Data lives in tmpfs — ephemeral across
  # restarts, which is correct for a disposable test DB and faster than a
  # disk-backed volume.
  neo4j-test:
    image: neo4j:5-community
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/explorator_test
      NEO4J_PLUGINS: '[]'
    tmpfs:
      - /data
    # Probe the HTTP listener (up alongside Bolt, as in CI): `neo4j status`
    # reports running before the database accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── Optional app stack (`make up`) ─────────────────────────────────────────
  # Profile `app` keeps these out of `make neo4j-up` / `make test`; they start
  # only with `docker compose --profile app ...`. Production-style images — for
  # hot-reload development use `make backend` + `make frontend` instead.
  backend:
    profiles: [app]
    build: ./backend
    # Run as the host user (`make up` sets APP_UID/APP_GID) so the bind mounts
    # below behave exactly as in the native workflow.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      # Reach Neo4j over the compose network. Process env outranks the mounted
      # backend/.env, so any localhost NEO4J_* there is overridden.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: explorator_dev
      # Process-env only, as natively: `LLM_MOCK=true make up`.
      LLM_MOCK: ${LLM_MOCK:-}
      EXPLORATOR_STYLE_DIR: /app/style
    # Same files as `make backend`, so state is shared with the native workflow
    # (which also shares the Neo4j volume): backend/.env is read as a file
    # (same validation as natively), approved genres land in the source-tree
    # catalog, and exports in backend/exports. `make up` creates the first two
    # host paths if missing; create_host_path: false stops Docker creating them
    # as root-owned directories.
    volumes:
      - type: bind
        source: ./backend/.env
        target: /app/.env
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./backend/exports
        target: /app/exports
        bind: {create_host_path: false}
      - type: bind
        source: ./backend/src/explorator/domain/style
        target: /app/style
        bind: {create_host_path: false}
    # Lets LLM_BASE_URL=http://host.docker.internal:<port>/v1 reach an LLM
    # server running on the Docker host (Ollama, LM Studio, vLLM).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${API_PORT:-8000}:8000"
    # Wait for Neo4j, or the backend falls back to limited (in-memory) mode.
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
