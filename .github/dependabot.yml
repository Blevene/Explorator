# Dependabot keeps dependencies fresh across every ecosystem in the repo.
# Minor + patch bumps are grouped per-ecosystem to keep PR noise down; majors
# still come through as individual PRs so they get a closer look.
version: 2
updates:
  # Backend (uv-managed; Dependabot reads pyproject.toml via the pip ecosystem).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend (Vite/React app).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint 10 and @eslint/js 10 require eslint-plugin-react-hooks v8+, which
      # isn't released yet; @eslint/js@10 already broke `npm ci` once. Keep this
      # pair on 9.x until the plugin supports eslint 10, then bump them together.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # E2E test harness (Playwright).
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      e2e-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
