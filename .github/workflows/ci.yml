name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on force-push to a PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What this workflow runs (and what it doesn't):
#
#  Runs on every PR + every push to main:
#    - Frontend ESLint
#    - Frontend type-check (via `npm run build` -> `tsc -b && vite build`)
#    - Frontend unit tests (vitest)
#    - Backend ruff (lint)
#    - Backend mypy (type-check, strict mode)
#
#  Deliberately not running yet (pre-existing debt; opt in when cleaned up):
#    - Backend pytest     (needs a Neo4j service; conftest imports neo4j)
#    - E2E (Playwright)   (needs Neo4j + a built frontend; doable later)
#
# The local Makefile + frontend/package.json scripts cover those for devs.

jobs:
  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build (also runs `tsc -b`)
        run: npm run build

  backend-lint:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src
