name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs on force-push to a PR branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What this workflow runs (and what it doesn't):
#
#  Runs on every PR + every push to main:
#    - Frontend ESLint
#    - Frontend type-check (via `npm run build` -> `tsc -b && vite build`)
#    - Frontend unit tests (vitest)
#    - Backend ruff (lint)
#    - Backend mypy (type-check, strict mode)
#    - Backend pytest (against a Neo4j service container)
#    - E2E Playwright (parallel / memory-mode lane only — no secrets, no Neo4j)
#
#  Deliberately not running here (run locally via the Makefile):
#    - E2E Neo4j lane (`make e2e-neo4j`)   needs durable Neo4j-backed learning
#      features + serial execution; intentionally excluded from CI so the suite
#      stays fork-safe (no service container, no secrets required).
#
# The local Makefile + frontend/package.json scripts cover those for devs.

jobs:
  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build (also runs `tsc -b`)
        run: npm run build

  backend-lint:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src

  backend-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Test Neo4j on port 7689 to match the local docker-compose `neo4j-test`
      # service and conftest defaults. Auth password matches NEO4J_TEST_PASSWORD.
      neo4j:
        image: neo4j:5-community
        ports:
          - 7689:7687
        env:
          NEO4J_AUTH: neo4j/explorator_test
          NEO4J_PLUGINS: '[]'
        # Probe the HTTP listener — Neo4j brings it up alongside bolt, and
        # wget ships in the neo4j:5-community image. `--health-start-period`
        # gives the JVM a head start before the first probe counts.
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      NEO4J_TEST_URI: bolt://localhost:7689
      NEO4J_TEST_PASSWORD: explorator_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-extras

      - name: Pytest
        run: uv run pytest -q

  e2e:
    name: E2E (Playwright, memory-mode lane)
    runs-on: ubuntu-latest
    # The parallel lane only. Each Playwright worker spawns its OWN backend in
    # in-memory mode (LLM_MOCK=true, NEO4J_URI pointed at a dead port) plus a
    # vite preview frontend, so this lane needs NO secrets and NO Neo4j service
    # container — it's fork-safe. The Neo4j e2e lane (`make e2e-neo4j`) is
    # intentionally excluded from CI; run it locally via the Makefile.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Backend deps: the per-worker backends are launched from backend/.venv.
      - name: Sync backend deps
        working-directory: backend
        run: uv sync --all-extras

      # Frontend: install + build, since `vite preview` (spawned per worker)
      # serves the built dist/.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Playwright (parallel lane)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
